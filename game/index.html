<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DUEL 21 — a blackjack card duel against the house</title>
<style>
  html, body { margin: 0; height: 100%; background: #06281a; display: flex; align-items: center; justify-content: center; }
  #game { display: block; box-shadow: 0 12px 48px rgba(0,0,0,0.55); border-radius: 10px; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="DUEL 21 card game: hit or stand against the dealer, first to take all three hearts wins"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
